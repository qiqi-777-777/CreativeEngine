server:
  port: 8080

spring:
  application:
    name: creative-engine-backend
  profiles:
    include: secret

  # 虚拟线程（Java 21）：请求由虚拟线程处理，模型调用/Redis/DB 这类 IO 等待场景下吞吐更好
  threads:
    virtual:
      enabled: true

  # 数据源配置（主机/端口/库名可用环境变量覆盖，便于容器编排接入 mysql 服务）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:creative_engine}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Redis 连接（app.redis.enabled=false 时不建立连接，仅保留配置）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2s

  # RabbitMQ 连接（app.mq.enabled=false 时不建立任何连接）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 消费异常不无限重投：日志属于旁路数据，落库失败记日志即可
        default-requeue-rejected: false

# Redis 应用开关与过期时间：关闭时全部退化为单机内存实现，便于本地零依赖启动
app:
  redis:
    enabled: ${REDIS_ENABLED:false}
    # 登录 token 有效期
    token-ttl: 7d
    # AI 会话记忆有效期（超过该时间未活跃则自动回收）
    chat-memory-ttl: 30m
    # 热点数据（政策列表、职业标签）缓存有效期
    hot-data-ttl: 10m

  # 多级缓存的 L1（进程内 Caffeine）：TTL 比 Redis 短，既能挡住绝大多数重复读，
  # 又能在多实例场景下较快感知到数据变化
  cache:
    local-ttl: 60s
    local-max-size: 1000

  # MQ 开关：关闭时 Agent 日志同步写库，本地零依赖即可运行；
  # 打开后投递到 RabbitMQ 由消费者异步落库，把写日志的耗时移出用户请求链路
  mq:
    enabled: ${MQ_ENABLED:false}

# DeepSeek AI配置（通过 LangChain4j 的 OpenAI 兼容客户端接入）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  # base-url 为服务根地址；未配置时会自动从 api-url 中截取
  base-url: https://api.deepseek.com/v1
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  temperature: 0.7
  max-tokens: 2000
  timeout-seconds: 60
  max-retries: 1
  log-requests: false
  log-responses: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 日志配置：控制台模板带上 traceId，便于把一次问答里的多次模型/工具调用串起来
logging:
  level:
    com.mingde.creativeengine: debug
    org.springframework.web: info
    # 工具与模型调用由 AgentTelemetry 统一打印（INFO），这里不再重复开 debug
    dev.langchain4j: warn
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:--}] [%15.15t] %-40.40logger{39} : %m%n'

# 大模型调用保护（Resilience4j）
# 限流：限制单位时间内真正打到 DeepSeek 的调用数，防止被刷爆配额；
# 熔断：DeepSeek 持续报错时快速失败，不再让请求一直挂在 60s 超时上拖住线程。
# 重试不在这里做——OpenAI 客户端已按 deepseek.max-retries 重试，叠两层会放大流量。
resilience4j:
  circuitbreaker:
    instances:
      deepseek:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  ratelimiter:
    instances:
      deepseek:
        limit-for-period: 20
        limit-refresh-period: 1s
        # 0 表示拿不到许可立即失败，不排队等待，避免请求堆积占住 Tomcat 线程
        timeout-duration: 0

# 运行指标：模型调用耗时/token、工具调用次数通过 Prometheus 暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
  health:
    # Resilience4j 的健康检查默认关闭，这里显式打开：
    # 熔断器打开时 /actuator/health 会跟着降级，可以直接接 K8s 探针或监控告警
    circuitbreakers:
      enabled: true
    # 未开启 MQ 时不做 RabbitMQ 健康检查，否则没装 broker 的环境会让整体状态直接 DOWN
    rabbit:
      enabled: ${app.mq.enabled:false}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 让模型调用耗时可算 P95/P99，而不只是平均值
      percentiles-histogram:
        agent.model.call: true
        agent.tool.call: true


